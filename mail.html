<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Почтовый ящик</title>

  <link rel="stylesheet" href="mail.css">
  <script defer src="mail.js"></script>
</head>

<body>

  <!-- ЭКРАН 1: Почтовый ящик + кнопка -->
  <div id="startScreen" class="screen">
    <img src="assets/icon-mail.png" class="mail-icon">
    <button id="openMailboxBtn" class="btn-main">Открыть почтовый ящик</button>
  </div>

  <!-- ЭКРАН 2: Проверка "не Alohomora" -->
  <div id="quizScreen" class="screen hidden">
    <div class="quiz-box">
      <h2>Докажите, что вы не Alohomora</h2>
      <p id="quizQuestion" class="quiz-question"></p>

      <div id="quizAnswers" class="quiz-answers"></div>

      <p class="quiz-errors">Ошибок: <span id="errorCount">0</span></p>
    </div>
  </div>

  <!-- ЭКРАН 3: Основная страница -->
  <div id="mailScreen" class="screen hidden">
    <div class="mail-container">

      <div class="bronze-box">
        <div id="blueLetter" class="mail-item">
           <img src="assets/icon-list.png" class="mail-list">
           <button id="openLetterBtn" class="btn-small-under">Открыть письмо</button>
        </div>


         <div class="mail-item">
         <img src="assets/cover-week.png" class="mail-magazine">
         <a href="magazine.html" class="btn-small-under">Забрать выпуск</a>
         </div>

      </div>

    </div>
  </div>

<!-- МОДУЛЬ ПИСЬМА -->
<div id="letterModal" class="letter-modal hidden">

  <div class="letter-window">

    <img src="assets/icon-message.png" class="letter-icon">

    <audio controls class="letter-audio">
      <source src="assets/dpfhss.mp3" type="audio/mpeg">
    </audio>

    <div class="letter-text-box">
      <p class="letter-text">
        Здесь будет длинный текст письма.  
        Он может быть очень длинным, поэтому блок прокручивается вниз.  
        Ты можешь вставить сюда любую историю, запись, послание, что угодно.  
        Текст будет красиво отображаться на пергаменте.
      </p>
    </div>

    <button id="closeLetterBtn" class="letter-close-btn">Закрыть</button>

  </div>

</div>


</body>
</html>
