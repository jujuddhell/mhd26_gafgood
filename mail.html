<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Почтовый ящик</title>

  <link rel="stylesheet" href="mail.css">
  <script defer src="mail.js"></script>
</head>

<body>

  <!-- ЭКРАН 1: Почтовый ящик + кнопка -->
  <div id="startScreen" class="screen">
    <img src="assets/icon-mail.png" class="mail-icon">
    <button id="openMailboxBtn" class="btn-main">Открыть почтовый ящик</button>
  </div>

  <!-- ЭКРАН 2: Проверка "не Alohomora" -->
  <div id="quizScreen" class="screen hidden">
    <div class="quiz-box">
      <h2>Докажите, что вы не Alohomora</h2>
      <p id="quizQuestion" class="quiz-question"></p>

      <div id="quizAnswers" class="quiz-answers"></div>

      <p class="quiz-errors">Ошибок: <span id="errorCount">0</span></p>
    </div>
  </div>

  <!-- ЭКРАН 3: Основная страница -->
  <div id="mailScreen" class="screen hidden">
    <div class="mail-container">

      <div class="bronze-box">
         <div class="mail-item">
          <div class="mail-img-wrapper">
          <img src="assets/icon-list.png" class="mail-img">
          <button class="btn-small">Открыть письмо</button>
          </div>
         </div>

         <div class="mail-item">
          <div class="mail-img-wrapper">
          <img src="assets/cover-week.png" class="mail-img">
          <a href="magazine.html" class="btn-small">Забрать выпуск</a>
          </div>
         </div>
      </div>

    </div>
  </div>

</body>
</html>
