<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Почтовый ящик</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="detective.css">
  <link rel="stylesheet" href="mail.css">
</head>

<body class="theme-detective">

  <header class="site-header">
    <div class="logo">Décalé</div>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Агентство</a>
      <a href="magazine.html" class="nav-link">Задира</a>
      <a href="mail.html" class="nav-link active">Почта</a>
    </nav>
  </header>

  <main class="mail-content">

    <h1 class="mail-title">Ваш почтовый ящик</h1>

    <div class="mailbox">
      <img src="assets/mailbox.png" alt="Почтовый ящик" class="mailbox-img">

      <div class="mail-items">

        <!-- Синее письмо -->
        <div class="letter blue-letter" id="blueLetter">
          <div class="letter-cover">
            <img src="assets/blue-envelope.png" alt="Синий конверт">
            <p>Открыть письмо</p>
          </div>

          <div class="letter-opened">
            <h2>Озвученное письмо</h2>

            <audio controls>
              <source src="assets/letter-voice.mp3" type="audio/mpeg">
            </audio>

            <p class="letter-text">
              Дорогая Ульяна,<br>
              Это спокойное озвученное письмо пришло из отдела магической корреспонденции…
            </p>

            <a href="magazine.html" class="letter-mag-link">
              Новый выпуск «Задиры»
            </a>
          </div>
        </div>

        <!-- Журнал -->
        <div class="magazine-item">
          <img src="assets/zadira-cover.png" alt="Журнал Задира" class="magazine-cover">
          <a href="magazine.html" class="magazine-link">Открыть журнал</a>
        </div>

      </div>
    </div>

  </main>

  <script src="interactions.js"></script>

</body>
</html>
